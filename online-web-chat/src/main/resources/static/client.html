<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天主界面</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/client.css" />
  </head>
  <body>
    <!-- 覆盖层，负责背景 -->
    <div class="cover"></div>
    <!-- 整个界面的总容器 -->
    <div class="client-container">
      <!-- 主要内容区域 -->
      <div class="main">
        <!-- 左侧区域，好友列表和会话记录 -->
        <div class="left">
          <!-- 当前用户名 -->
          <div class="user"></div>
          <div class="search">
            <input type="text" placeholder="搜索好友" />
            <button></button>
          </div>
          <!-- 标签页 -->
          <div class="tab">
            <div class="tab-session"></div>
            <div class="tab-friend"></div>
          </div>
          <!-- 会话列表 -->
          <ul class="list" id="session-list">
            <li>
              <h3></h3>
              <p></p>
            </li>
          </ul>
          <!-- 好友列表 -->
          <ul class="list hide" id="friend-list"></ul>
        </div>
        <!-- 右侧区域，聊天编辑框 -->
        <div class="right">
          <!-- 聊天标题 -->
          <div class="title"></div>
          <!-- 消息区 -->
          <div class="message-show">
            <!-- <div class="message message-left">
              <div class="box">
                <h4>zhangsan</h4>
                <p>今天吃啥</p>
              </div>
            </div>
            <div class="message message-right">
              <div class="box">
                <h4>lisi</h4>
                <p>我好饿，我们去吃自助餐吧</p>
              </div>
            </div> -->
          </div>
          <!-- 编辑区 -->
          <textarea class="message-input"></textarea>
          <!-- 发送按钮 -->
          <div class="ctrl">
            <button>发送</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script src="js/client.js"></script>
  </body>
</html>
