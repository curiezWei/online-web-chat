<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天主界面</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/client.css" />
  </head>
  <body>
    <!-- 覆盖层，负责背景 -->
    <div class="cover"></div>
    <!-- 整个界面的总容器 -->
    <div class="client-container">
      <!-- 主要内容区域 -->
      <div class="main">
        <!-- 左侧区域，好友列表和会话记录 -->
        <div class="left">
          <!-- 当前用户名 -->
          <div class="user"></div>
          <div class="search">
            <input type="text" placeholder="搜索好友" />
            <button aria-label="搜索">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </button>
          </div>
          <!-- 标签页 -->
          <div class="tab">
            <div class="tab-session">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
              </svg>
              <span>会话</span>
            </div>
            <div class="tab-friend">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
              <span>好友</span>
            </div>
          </div>
          <!-- 会话列表 -->
          <ul class="list" id="session-list">
            <li>
              <h3></h3>
              <p></p>
            </li>
          </ul>
          <!-- 好友列表 -->
          <ul class="list hide" id="friend-list">
            <li id="new-friend-entry"><h4>新好友</h4></li>
          </ul>
        </div>
        <!-- 右侧区域，聊天编辑框 -->
        <div class="right">
          <!-- 移动端返回按钮 -->
          <button class="mobile-back" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <!-- 聊天标题 -->
          <div class="title"></div>
          <!-- 消息区 -->
          <div class="message-show"></div>
          <!-- 编辑区 -->
          <textarea class="message-input" placeholder="输入消息..."></textarea>
          <!-- 发送按钮 -->
          <div class="ctrl">
            <button>发送</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script src="js/client.js"></script>
  </body>
</html>
